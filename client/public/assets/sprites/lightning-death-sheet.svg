<svg xmlns="http://www.w3.org/2000/svg" width="768" height="128" viewBox="0 0 768 128" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Frame 1: spark -->
  <g transform="translate(0 0)">
    <rect x="62" y="8" width="4" height="18" fill="#bae6fd"/>
    <rect x="58" y="18" width="12" height="4" fill="#fff"/>
    <rect x="60" y="26" width="8" height="4" fill="#38bdf8"/>
  </g>

  <!-- Frame 2: thin strike -->
  <g transform="translate(128 0)">
    <path d="M62 8h8l-5 28h9l-15 34 4-24h-9z" fill="#0ea5e9"/>
    <path d="M64 8h4l-4 28h6L58 60l4-23h-5z" fill="#fff"/>
  </g>

  <!-- Frame 3: full impact -->
  <g transform="translate(256 0)">
    <path d="M57 4h14l-7 31h14L54 83l7-34H45z" fill="#0284c7"/>
    <path d="M60 4h7l-6 31h10L57 72l5-30h-9z" fill="url(#bolt)"/>
    <rect x="47" y="84" width="34" height="5" fill="#67e8f9"/>
    <rect x="38" y="91" width="10" height="4" fill="#bae6fd"/>
    <rect x="82" y="91" width="9" height="4" fill="#fff"/>
    <rect x="54" y="99" width="6" height="6" fill="#38bdf8"/>
    <rect x="72" y="101" width="5" height="5" fill="#7dd3fc"/>
  </g>

  <!-- Frame 4: aura burst -->
  <g transform="translate(384 0)">
    <path d="M61 10h8l-4 28h8L56 70l5-27h-7z" fill="url(#blue)"/>
    <path d="M64 10h3l-3 28h5L59 60l4-24h-4z" fill="#fff"/>
    <path d="M24 63h18M86 63h18M33 35l13 10M95 35L82 45M44 91l9-12M84 91l-9-12" stroke="#67e8f9" stroke-width="4"/>
    <rect x="48" y="78" width="34" height="4" fill="#bae6fd"/>
  </g>

  <!-- Frame 5: dissipating sparks -->
  <g transform="translate(512 0)">
    <path d="M63 17h6l-4 24h6L59 63l4-20h-5z" fill="#7dd3fc"/>
    <rect x="30" y="38" width="8" height="4" fill="#38bdf8"/>
    <rect x="91" y="29" width="7" height="4" fill="#bae6fd"/>
    <rect x="39" y="78" width="6" height="5" fill="#fff"/>
    <rect x="84" y="70" width="5" height="5" fill="#67e8f9"/>
    <rect x="59" y="91" width="8" height="4" fill="#38bdf8"/>
  </g>

  <!-- Frame 6: residual static -->
  <g transform="translate(640 0)">
    <path d="M63 28h5l-3 16h5L61 59l3-14h-4z" fill="#93c5fd" opacity=".6"/>
    <rect x="43" y="52" width="5" height="3" fill="#bae6fd" opacity=".6"/>
    <rect x="78" y="42" width="4" height="3" fill="#67e8f9" opacity=".55"/>
    <rect x="57" y="76" width="4" height="3" fill="#fff" opacity=".45"/>
  </g>
</svg>
